# Continuous deployment: every push to main builds the image and deploys it to Cloud Run.
substitutions:
  _REGION: us-central1
  _SERVICE: plug-fest-bot
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/plug-fest-bot/plug-fest-bot

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:${SHORT_SHA}', '-t', '${_IMAGE}:latest', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_IMAGE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=plug-fest-bot-run@${PROJECT_ID}.iam.gserviceaccount.com
      - --allow-unauthenticated
      # Keep uploads (bucket) and their records and feedback (Firestore) in this project.
      - --set-env-vars=UPLOAD_BUCKET=plug-fest-bot-uploads,GOOGLE_CLOUD_PROJECT=${PROJECT_ID}
      - --memory=1Gi
      - --max-instances=3
      - --quiet

images: ['${_IMAGE}:${SHORT_SHA}', '${_IMAGE}:latest']

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
